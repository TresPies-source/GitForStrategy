name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-check (templates, seeds index, commands, version, rule counts, example)
        run: python scripts/gfs.py selfcheck
      - name: This repository's own strategy workspace
        run: python scripts/gfs.py validate --strict
      - name: Example workspace
        run: python scripts/gfs.py validate --root examples/native-or-web --strict
